    question: Does the skill get selected for relevant exchanges without an explicit
      invocation?
    context: Test embedded workflow questions and nearby exclusions separately from
      performance after the skill loads; current live selection has not been
      measured.
    status: open
  - skill: ask-user-question
    question: Do the selected host surfaces preserve the question and return a
      delayed answer correctly in live use?
    context: Peter selected Claude Code, Codex, and Gemini; current docs and pinned
      source establish contract differences, but rendered and delayed-response
      checks remain to be run.
    status: open
  - skill: ask-user-question
    question: Does a revision improve next-action selection and repair in the
      supplied Brain workflow scenarios?
    context: Research supports design candidates; no revised skill or model
      evaluation exists yet.
    status: open
